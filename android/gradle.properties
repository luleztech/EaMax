# Keep Gradle lean on 8GB machines (media_kit native extract is memory-heavy).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
# Skip release lint (OOM on low-RAM hosts); app code is still compiled/shrunk.
android.lint.checkReleaseBuilds=false
# Built-in Kotlin (AGP 9+) — do not apply kotlin-android in app/build.gradle.kts
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
