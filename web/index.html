<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EaMax — stream live TV and movies">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Prevent browser link styling from underlining Flutter semantics nodes on web. */
    a, a:visited, a:hover, a:active {
      text-decoration: none !important;
      border-bottom: none !important;
      box-shadow: none !important;
    }
    flt-semantics a, flt-semantics * {
      text-decoration: none !important;
      border-bottom: none !important;
      box-shadow: none !important;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="eamax_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EaMax</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Use bundled CanvasKit (no gstatic CDN) so web boots offline / behind firewalls.
    See: https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      config: {
        // Prefer the CanvasKit wasm/js shipped with the build instead of
        // https://www.gstatic.com/flutter-canvaskit/... which often fails to fetch.
        canvasKitBaseUrl: "canvaskit/"
      }
    });
  </script>
</body>
</html>
